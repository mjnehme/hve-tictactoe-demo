<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tic-Tac-Toe</title>
  <link rel="icon" href="data:,">
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#111111">
  <style>
    * {
      box-sizing: border-box;
    }

    html {
      touch-action: manipulation;
    }

    body {
      display: flex;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
      flex-direction: column;
      align-items: center;
      background: #e6f4ff;
      color: #111;
      font-family: system-ui, sans-serif;
      font-size: 20px;
    }

    main {
      display: flex;
      width: 100%;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 8vw, 44px);
    }

    #turn {
      min-height: 1.4em;
      margin: 8px 0 12px;
      font-size: clamp(24px, 7vw, 40px);
      font-weight: 700;
      overflow-wrap: anywhere;
      text-align: center;
    }

    .mark-o {
      color: #0645ad;
    }

    .board {
      display: grid;
      width: min(92vw, 420px);
      aspect-ratio: 1;
      padding: 8px;
      border: 8px solid transparent;
      border-radius: 18px;
      gap: 8px;
      grid-template-columns: repeat(3, 1fr);
      transition: border-color 0.15s;
    }

    .board.turn-x {
      border-color: #111;
    }

    .board.turn-o {
      border-color: #0645ad;
    }

    .cell {
      min-width: 64px;
      min-height: 64px;
      padding: 0;
      border: 3px solid #111;
      border-radius: 12px;
      background: #fff;
      color: #111;
      cursor: pointer;
      font-size: clamp(48px, 18vw, 110px);
      font-weight: 800;
    }

    .cell.o {
      color: #0645ad;
    }

    .cell:disabled {
      cursor: default;
      opacity: 1;
    }

    .cell.win {
      background: #ffe066;
    }

    .cell:focus-visible,
    input:focus-visible,
    #again:focus-visible {
      outline: 4px solid #0645ad;
      outline-offset: 2px;
    }

    #score {
      display: flex;
      max-width: 100%;
      margin-top: 14px;
      flex-wrap: wrap;
      gap: 8px 20px;
      justify-content: center;
      font-size: 18px;
      font-weight: 600;
      text-align: center;
    }

    #score span {
      max-width: 100%;
      overflow-wrap: anywhere;
    }

    .names {
      display: flex;
      max-width: 100%;
      margin-top: 16px;
      flex-wrap: wrap;
      gap: 12px 16px;
      justify-content: center;
      font-size: 18px;
    }

    .names label {
      display: flex;
      min-width: 0;
      align-items: center;
      gap: 6px;
    }

    .names input {
      width: min(8em, 54vw);
      min-width: 0;
      padding: 6px;
      border: 2px solid #555;
      border-radius: 6px;
      font-size: 18px;
    }

    #again {
      min-height: 56px;
      margin-top: 16px;
      padding: 14px 28px;
      border: 2px solid #111;
      border-radius: 10px;
      background: #111;
      color: #fff;
      cursor: pointer;
      font-size: 22px;
    }

    #offline {
      max-width: 42rem;
      margin: 18px 0 0;
      font-size: 18px;
      overflow-wrap: anywhere;
      text-align: center;
    }

    @media (forced-colors: active) {
      .board.turn-x,
      .board.turn-o {
        border-color: Highlight;
      }

      .cell.win {
        background: Highlight;
        color: HighlightText;
      }

      .cell:focus-visible,
      input:focus-visible,
      #again:focus-visible {
        outline-color: Highlight;
      }
    }
  </style>
</head>
<body data-release="2026-10-23.1">
  <main>
    <h1>Tic-Tac-Toe</h1>
    <div id="turn" role="status" aria-live="polite" aria-atomic="true"></div>
    <div id="board" class="board" role="group" aria-label="Tic-Tac-Toe board"></div>
    <div id="score" aria-label="Score this session">
      <span id="scoreX"></span>
      <span id="scoreO"></span>
      <span id="scoreDraw"></span>
    </div>
    <button id="again" type="button" hidden>Play again</button>
    <div class="names" aria-label="Optional player names">
      <label>Edit X name: <input id="nameX" placeholder="X" maxlength="12"></label>
      <label>Edit O name: <input id="nameO" placeholder="O" maxlength="12"></label>
    </div>
    <p id="offline" role="status" aria-live="polite" aria-atomic="true">
      Online play is ready. Offline play is preparing.
    </p>
  </main>
  <script>
    const LINES = [
      [0, 1, 2], [3, 4, 5], [6, 7, 8],
      [0, 3, 6], [1, 4, 7], [2, 5, 8],
      [0, 4, 8], [2, 4, 6]
    ];

    function newGame() {
      return {board: Array(9).fill(null), turn: "X", winner: null, line: null};
    }

    function play(current, index) {
      if (current.winner || current.board[index]) {
        return current;
      }

      const board = current.board.slice();
      board[index] = current.turn;

      for (const line of LINES) {
        const [a, b, c] = line;
        if (board[a] && board[a] === board[b] && board[a] === board[c]) {
          return {board, turn: current.turn, winner: board[a], line};
        }
      }

      if (board.every(Boolean)) {
        return {board, turn: current.turn, winner: "draw", line: null};
      }

      return {
        board,
        turn: current.turn === "X" ? "O" : "X",
        winner: null,
        line: null
      };
    }

    const byId = id => document.getElementById(id);
    const boardElement = byId("board");
    const turnElement = byId("turn");
    const againButton = byId("again");
    const offlineElement = byId("offline");
    const score = {X: 0, O: 0, draw: 0};
    let state = newGame();

    const customName = player => byId(`name${player}`).value.trim();
    const playerName = player => customName(player) || player;
    const playerLabel = player => {
      const custom = customName(player);
      return custom ? `${custom} (${player})` : player;
    };

    function focusAfterMove(index) {
      if (state.winner) {
        againButton.focus();
        return;
      }

      const cells = [...boardElement.children];
      const next = cells.find((cell, cellIndex) => cellIndex > index && !cell.disabled)
        || cells.find(cell => !cell.disabled);
      next?.focus();
    }

    for (let index = 0; index < 9; index += 1) {
      const cell = document.createElement("button");
      const row = Math.floor(index / 3) + 1;
      const column = (index % 3) + 1;
      cell.type = "button";
      cell.className = "cell";
      cell.dataset.index = String(index);
      cell.setAttribute("aria-label", `Row ${row}, column ${column}, empty`);
      cell.addEventListener("click", () => {
        const previous = state;
        state = play(state, index);
        if (state === previous) {
          return;
        }
        if (!previous.winner && state.winner) {
          score[state.winner] += 1;
        }
        render();
        focusAfterMove(index);
      });
      boardElement.appendChild(cell);
    }

    function render() {
      [...boardElement.children].forEach((cell, index) => {
        const value = state.board[index];
        const row = Math.floor(index / 3) + 1;
        const column = (index % 3) + 1;
        cell.textContent = value || "";
        cell.className = `cell${value === "O" ? " o" : ""}${state.line?.includes(index) ? " win" : ""}`;
        cell.disabled = Boolean(value || state.winner);
        cell.setAttribute("aria-label", `Row ${row}, column ${column}, ${value || "empty"}`);
      });

      boardElement.className = `board${state.winner ? "" : ` turn-${state.turn.toLowerCase()}`}`;
      const announcedPlayer = state.winner === "draw" ? null : (state.winner || state.turn);
      turnElement.className = announcedPlayer === "O" ? "mark-o" : "";
      turnElement.textContent = state.winner === "draw"
        ? "It is a draw!"
        : state.winner
          ? `${playerLabel(state.winner)} wins!`
          : `${playerLabel(state.turn)}'s turn`;
      byId("scoreX").textContent = `${playerName("X")}: ${score.X}`;
      byId("scoreO").textContent = `${playerName("O")}: ${score.O}`;
      byId("scoreDraw").textContent = `Draws: ${score.draw}`;
      againButton.hidden = !state.winner;
    }

    againButton.addEventListener("click", () => {
      state = newGame();
      render();
      boardElement.querySelector(".cell:not(:disabled)")?.focus();
    });
    byId("nameX").addEventListener("input", render);
    byId("nameO").addEventListener("input", render);

    window.ticTacToe = Object.freeze({LINES, newGame, play});
    render();

    async function registerOfflineSupport() {
      if (!("serviceWorker" in navigator)) {
        offlineElement.textContent = "Online play is ready. Offline play is unavailable in this browser.";
        return;
      }

      try {
        const registration = await navigator.serviceWorker.register("./sw.js", {
          scope: "./",
          updateViaCache: "none"
        });

        const showWaitingUpdate = () => {
          offlineElement.textContent = "Offline play is ready. An update is ready after you finish: close every game tab, then reopen the game.";
        };

        if (registration.waiting) {
          showWaitingUpdate();
        }

        registration.addEventListener("updatefound", () => {
          const installing = registration.installing;
          installing?.addEventListener("statechange", () => {
            if (installing.state === "installed" && navigator.serviceWorker.controller) {
              showWaitingUpdate();
            }
          });
        });

        const installFailed = new Promise((resolve, reject) => {
          const worker = registration.installing;
          if (!worker) {
            return;
          }
          worker.addEventListener("statechange", () => {
            if (worker.state === "redundant") {
              reject(new Error("The service worker could not cache every required asset."));
            }
          });
        });
        const installTimedOut = new Promise((resolve, reject) => {
          setTimeout(() => reject(new Error("Offline setup timed out.")), 10_000);
        });
        await Promise.race([navigator.serviceWorker.ready, installFailed, installTimedOut]);
        if (!registration.waiting) {
          offlineElement.textContent = "Offline play is ready on this device.";
        }
      } catch (error) {
        console.error("Offline setup failed.", error);
        offlineElement.textContent = "Online play is ready. Offline play is unavailable right now.";
      }
    }

    registerOfflineSupport();
  </script>
</body>
</html>
